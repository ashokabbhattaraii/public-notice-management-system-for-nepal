[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit, not ruff's built-in default — a bare `pip install ruff` in CI
# resolves whatever the latest version is, and ruff has changed its default
# rule set across versions before. Pinning the selection here means a ruff
# upgrade can't silently start failing CI with a pile of new findings (as
# happened once already: an unpinned newer ruff surfaced 124 findings here,
# almost all pyupgrade (UP0xx) style modernizations unrelated to correctness).
select = ["E4", "E7", "E9", "F"]
